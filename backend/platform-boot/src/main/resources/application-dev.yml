spring:
  datasource:
    url: jdbc:h2:mem:platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  h2:
    console:
      enabled: false

logging:
  level:
    com.enterprise.platform: debug
    org.springframework.jdbc.datasource.init: info

platform:
  cache:
    redis-enabled: false
