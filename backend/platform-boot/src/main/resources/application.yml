server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: enterprise-permission-platform
  profiles:
    active: dev
  jackson:
    time-zone: GMT+8
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  sql:
    init:
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.enterprise.platform: info

platform:
  auth:
    # internal：平台内置 JWT；keycloak：使用 Keycloak 的 JWKS 验签
    mode: internal
    secret: ${PLATFORM_JWT_SECRET:platform-dev-secret-please-change-32-bytes-min-2026}
    issuer: enterprise-platform
    access-token-ttl-seconds: 7200
    refresh-token-ttl-seconds: 604800
    # 应用层 URL 级兜底鉴权（生产建议在网关做统一拦截）
    url-check-enabled: false
  tenant:
    enabled: true
    header-resolve-enabled: true
    schema-prefix: tenant_
    schema-isolation-enabled: true
    cache-seconds: 300
    ignore-tables:
      - sys_tenant
      - sys_casbin_rule
  cache:
    redis-enabled: false
    ttl-seconds: 300
    local-max-size: 20000
  data-permission:
    enabled: true
    tables:
      - biz_order
    statements:
      - SysUserMapper.selectPage
